<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>หอไตรนามศัพท์ — ภาษาบาลี บ21202</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&amp;family=Sarabun:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>:root{--navy:#1F6FB2;--navy2:#3A8FD6;--navy3:#155A93;--orange:#E5508F;--orange2:#BE3A73;--pali:#1F4FA0;--green:#2F7A5B;--green2:#E3F1EA;--brown:#8A5A2B;--brown2:#F4E8D8;--brick:#B3412B;--brick2:#FBEAE6;--cream:#F4FAFF;--paper:#FFFFFF;--ink:#22303F;--ink2:#55606E;--line:#E3DDF0;--gold:#E9B22C;--gold2:#FFE07A;--silver:#8D99A6;--bronze:#A86A3D;--shadow:0 6px 22px rgba(31,111,178,.12);--r:16px;--fh:'Mitr','Sarabun','Noto Sans Thai',Tahoma,sans-serif;--fb:'Sarabun','Noto Sans Thai',Tahoma,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body,html{margin:0;padding:0}
body{font-family:var(--fb);font-size:18px;line-height:1.7;color:var(--ink);background:var(--cream);min-height:100vh;overflow-x:hidden;background:linear-gradient(180deg,#e3f3ff 0,#fff0f7 55%,#fff8d9 100%) fixed}
body.fs-max{position:fixed;inset:0;overflow:auto}
button{font-family:var(--fh);cursor:pointer}
input,select,textarea{font-family:var(--fb);font-size:18px}
h1,h2,h3{font-family:var(--fh);font-weight:600;line-height:1.35;margin:.2em 0 .4em;color:var(--navy)}
h1{font-size:26px}
h2{font-size:22px}
h3{font-size:19px}
.hidden{display:none!important}
.pali{color:var(--pali);font-weight:700}
.muted{color:var(--ink2)}
.small{font-size:14px}
.center{text-align:center}
.nw{white-space:nowrap}
.row{display:flex;gap:10px;align-items:center}
.wrapf{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sp{height:12px}
#topbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:8px;padding:8px 12px;background:linear-gradient(90deg,#2b86cf,#5bb0ea 60%,#f08dba);color:#fff;box-shadow:0 2px 10px rgba(0,0,0,.18)}
#topbar .crest{width:34px;height:34px}
#topbar .who{flex:1;min-width:0;line-height:1.25}
#topbar .who b{font-family:var(--fh);font-weight:500;font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .who span{font-size:13px;opacity:.8}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.12);color:#fff;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:22px;height:22px}
.sync{font-size:12px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap;display:inline-flex;gap:4px;align-items:center}
.sync.err{background:#b3412b}
@media (max-width:480px){.sync .st{display:none}
.sync{padding:4px 6px}
#topbar{gap:6px;padding:8px}
.ibtn{width:38px;height:38px}}.pv-banner{background:#6b4ba0;color:#fff;text-align:center;font-size:14px;padding:4px 8px}
main.wrap{max-width:720px;margin:0 auto;padding:12px 16px 90px}
.scr{display:none;animation:scrIn .28s ease both}
.scr.on{display:block}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}
to{opacity:1;transform:none}}.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:12px 0;overflow:hidden;position:relative}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:14px;border:0;background:var(--orange);color:#fff;font-size:18px;font-weight:500;box-shadow:0 4px 0 var(--orange2);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange2)}
.btn.navy{background:var(--navy);box-shadow:0 4px 0 var(--navy3)}
.btn.green{background:var(--green);box-shadow:0 4px 0 #1f5a41}
.btn.ghost{background:#fff;color:var(--navy);border:2px solid var(--line);box-shadow:none}
.btn.ghost:active{transform:scale(.98)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;font-size:15px;padding:6px 14px;border-radius:11px}
.btn:disabled{opacity:.5;filter:grayscale(.5)}
.btn svg{width:20px;height:20px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:0 0;color:var(--navy);font-size:16px;padding:6px 0;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:14px;padding:2px 10px;border-radius:99px;background:#e6f1fc;color:var(--navy);white-space:nowrap;line-height:1.6}
.chip.open{background:#fde6f0;color:#a3285e}
.chip.done{background:var(--green2);color:var(--green)}
.chip.late{background:var(--brick2);color:var(--brick)}
.chip.lock{background:#eee;color:#777}
.chip.gold{background:#fbf1d2;color:#7c5a0b}
.chip.silver{background:#eef1f4;color:#4d5a66}
.chip.bronze{background:#f6e6da;color:#7a4521}
.chip svg{width:14px;height:14px}
#scr-boot .card{text-align:center;padding:28px 18px}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid #f6d3e3;border-top-color:var(--orange);animation:spin 1s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}#scr-login{padding-top:10px}
.login-hero{text-align:center;padding:10px 0 0}
.crest-halo{width:116px;height:116px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#fff 55%,rgba(255,255,255,0) 72%);position:relative}
.crest-halo::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(229,80,143,.55),transparent 40%,rgba(31,79,160,.45),transparent 75%);animation:spin 6s linear infinite;mask:radial-gradient(circle,transparent 60%,#000 61%);-webkit-mask:radial-gradient(circle,transparent 60%,#000 61%)}
.crest{display:block;object-fit:contain}
.login-ttl{font-size:28px;margin:10px 0 0}
.login-sub{margin:0;color:var(--ink2);font-size:16px}
.glow-frame{position:relative;border-radius:22px;padding:3px;margin:18px 0 10px;overflow:hidden}
.glow-frame::before{content:'';position:absolute;inset:-60%;background:conic-gradient(var(--orange),var(--gold2),var(--pali),var(--green),var(--orange));animation:spin 4.5s linear infinite}
.glow-frame.ok::before{background:conic-gradient(var(--green),#9fe0bd,var(--green))}
.glow-frame.bad::before{background:conic-gradient(var(--brick),#f2a090,var(--brick));animation-duration:1s}
.glow-frame>.card{margin:0;position:relative;border:0;border-radius:19px}
.id-label{font-family:var(--fh);font-weight:500;color:var(--navy);display:block;margin-bottom:6px}
.id-input{width:100%;font-size:26px;letter-spacing:2px;text-align:center;padding:12px;border-radius:14px;border:2px solid var(--line);background:#fff;font-family:var(--fh);color:var(--navy)}
.id-input:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px rgba(229,80,143,.15)}
.id-dots{display:flex;gap:6px;justify-content:center;margin:10px 0 14px;min-height:12px}
.id-dots i{width:10px;height:10px;border-radius:50%;background:var(--orange);animation:pop .25s ease}
@keyframes pop{from{transform:scale(0)}
to{transform:scale(1)}}.login-hint{font-size:14px;color:var(--ink2);text-align:center;margin:12px 0 0}
.shine{position:relative;overflow:hidden}
.shine::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);animation:shine 3.2s ease-in-out infinite}
@keyframes shine{0%,55%{left:-60%}
100%{left:130%}}.journey{display:flex;gap:4px;justify-content:center;margin:6px 0 2px;flex-wrap:wrap}
.journey span{font-size:13px;padding:2px 10px;border-radius:99px;background:#e6f1fc;color:var(--ink2);white-space:nowrap}
.journey span.on{background:var(--navy);color:#fff}
.talk{display:flex;align-items:flex-end;gap:8px;margin:10px 0}
.talk .who-c{flex:none}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:17px;line-height:1.6}
.bubble::before{content:'';position:absolute;left:-9px;bottom:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble b.nm{display:block;font-family:var(--fh);font-weight:500;font-size:14px;color:var(--orange2)}
.tower-head{display:flex;align-items:center;gap:10px;margin:4px 0 6px}
.tower-head h1{margin:0;font-size:24px}
.tower-tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.tower-tools .btn{flex:1;min-width:140px}
.cta{display:flex;align-items:center;gap:10px;width:100%;text-align:left;justify-content:flex-start}
.cta small{display:block;font-family:var(--fb);font-size:13px;opacity:.85}
.tower{position:relative;margin:6px auto 0;max-width:560px}
.roof{display:block;width:100%;height:auto}
.floors{background:linear-gradient(#fff6d6,#ffe6f0);border-left:10px solid #c2457f;border-right:10px solid #c2457f;padding:8px 10px;position:relative}
.floors::after,.floors::before{content:'';position:absolute;top:0;bottom:0;width:5px;background:repeating-linear-gradient(#e9b22c 0 10px,#c2457f 10px 20px)}
.floors::before{left:-8px}
.floors::after{right:-8px}
.base{height:26px;background:linear-gradient(#c2457f,#9c2f63);border-radius:0 0 10px 10px;margin:0 -6px;position:relative}
.base::after{content:'';position:absolute;left:8%;right:8%;bottom:-8px;height:8px;background:#f3d97a;border-radius:0 0 8px 8px}
.floor{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #f4c6db;border-radius:14px;padding:8px 10px;margin:8px 0;min-height:76px;position:relative;cursor:pointer;transition:transform .12s}
.floor:active{transform:scale(.985)}
.floor .fl-no{flex:none;width:48px;height:48px;border-radius:12px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--fh)}
.floor .fl-no small{font-size:11px;opacity:.85}
.floor .fl-no b{font-size:21px;font-weight:600}
.floor .fl-body{flex:1;min-width:0}
.floor .fl-t{font-family:var(--fh);font-weight:600;font-size:16.5px;color:var(--navy);line-height:1.3;white-space:nowrap;overflow:hidden}
.floor .fl-m{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.floor .fl-side{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.floor .dots{display:flex;gap:4px}
.floor .dots i{width:12px;height:12px;border-radius:50%;background:#e6eef8;border:1px solid #c9d8ea}
.floor .dots i.on{background:var(--green);border-color:var(--green)}
.floor.locked{filter:grayscale(.75);opacity:.75;cursor:default}
.floor.locked .fl-no{background:#8a8f96}
.floor.cur{border-color:var(--orange);box-shadow:0 0 0 4px rgba(229,80,143,.18),0 8px 20px rgba(229,80,143,.2);animation:curGlow 2.4s ease-in-out infinite}
@keyframes curGlow{50%{box-shadow:0 0 0 7px rgba(229,80,143,.1),0 8px 26px rgba(229,80,143,.28)}}.floor.cur::after{content:'เล่นต่อที่นี่';position:absolute;top:-11px;right:12px;font-size:12px;background:var(--orange);color:#fff;padding:0 10px;border-radius:99px;font-family:var(--fh)}
.floor.done{background:linear-gradient(90deg,#fff,#fff4d0)}
.floor.mid .fl-no{background:#c2457f}
.guard{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff3da;border:2px solid #e8cf95;overflow:hidden}
.guard svg{width:40px;height:40px}
.guard.off{filter:grayscale(1) opacity(.35)}
.medal{width:34px;height:34px}
.unit-hero{display:flex;gap:12px;align-items:center}
.unit-hero .fl-no{width:60px;height:60px;border-radius:16px;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fh);flex:none}
.unit-hero .fl-no b{font-size:26px;line-height:1}
.unit-hero h1{font-size:22px;margin:0}
.meta{font-size:14px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:4px 10px}
.stage{border-left:6px solid var(--orange)}
.stage.s2{border-left-color:var(--navy)}
.stage.lockd{opacity:.6}
.stage h2{display:flex;align-items:center;gap:8px;margin:0 0 2px}
.stage h2 .tag{font-size:13px;font-family:var(--fb);font-weight:600;background:#fff3c9;color:var(--brown);padding:0 8px;border-radius:99px}
.steps{display:flex;flex-direction:column;gap:6px;margin:10px 0 12px}
.step{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#f5f9ff;border:1px solid #dee9f6}
.step .ck{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid #bfd3ea;display:flex;align-items:center;justify-content:center;font-size:14px;color:#6e8db0;background:#fff;font-family:var(--fh)}
.step.done .ck{background:var(--green);border-color:var(--green);color:#fff}
.step.now{border-color:var(--orange);background:#fff0f6}
.step .st-t{flex:1;min-width:0;font-weight:600;line-height:1.35}
.step .st-t small{display:block;font-weight:400;color:var(--ink2);font-size:13.5px}
.step .st-r{font-size:14px;color:var(--ink2);white-space:nowrap}
.testbox{background:#f2f5fa;border:1px dashed #9eb0c9;border-radius:14px;padding:12px;margin-top:8px}
.testbox .score{font-family:var(--fh);font-size:22px;color:var(--navy)}
.warn{background:var(--brick2);color:#7c2a1a;border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0}
.info{background:#eef4fb;color:var(--navy);border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0}
.okbox{background:var(--green2);color:#1e5b42;border-radius:12px;padding:8px 12px;font-size:15px;margin:8px 0}
.topic{border-left:5px solid var(--navy)}
.topic h3{margin-top:0}
.topic p{margin:.35em 0}
.topic ol,.topic ul{margin:.3em 0;padding-left:1.4em}
.topic table{border-collapse:collapse;width:100%;margin:8px 0;font-size:16.5px}
.topic th{background:var(--navy);color:#fff;font-family:var(--fh);font-weight:500;padding:6px 8px;text-align:left}
.topic td{border-bottom:1px solid var(--line);padding:6px 8px;vertical-align:top}
.topic tr:nth-child(2n) td{background:#f5f9ff}
.tbl-wrap{overflow-x:auto}
.decl td:first-child{white-space:nowrap;color:var(--ink2);font-size:15px}
.decl td:not(:first-child){color:var(--pali);font-weight:700}
.btn-say{border:0;background:#eef4fb;color:var(--pali);border-radius:8px;padding:0 6px;margin-left:4px;font-size:13px;min-height:26px;vertical-align:middle}
.play-top{display:flex;align-items:center;gap:8px}
.play-top .grow b{font-family:var(--fh);font-weight:500;color:var(--navy);display:block;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-top .grow span{font-size:13px;color:var(--ink2)}
.pbar{height:10px;border-radius:99px;background:#e6eef8;overflow:hidden;margin:8px 0}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),#ffc94a);border-radius:99px;transition:width .3s}
.scene{position:relative;border-radius:18px;overflow:hidden;min-height:120px;display:flex;align-items:flex-end;justify-content:space-between;padding:8px 10px 6px;margin:6px 0;background:linear-gradient(#dcebfa,#f6ebd5 70%)}
.scene .sc-bg{position:absolute;inset:0;z-index:0}
.scene>:not(.sc-bg){position:relative;z-index:1}
.scene .nong{filter:drop-shadow(0 3px 2px rgba(0,0,0,.12))}
.q-card{background:#fff;border-radius:16px;border:2px solid var(--line);padding:14px;margin:8px 0;text-align:center}
.q-card .q-k{font-size:13px;color:var(--orange2);font-family:var(--fh);letter-spacing:.3px}
.q-card .q-t{font-size:19.5px;line-height:1.6;font-weight:600}
.q-card .q-w{font-size:28px;color:var(--pali);font-weight:700;font-family:var(--fb);line-height:1.35;margin:4px 0}
.q-card .q-s{font-size:15px;color:var(--ink2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.opts.one{grid-template-columns:1fr}
.opt{min-height:56px;border-radius:14px;border:2px solid #d6e3f3;background:#fff;color:var(--ink);font-family:var(--fb);font-size:18px;font-weight:600;padding:8px 10px;line-height:1.35;box-shadow:0 3px 0 #d6e3f3;transition:transform .08s,background .15s}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 #d6e3f3}
.opt.pl{color:var(--pali);font-size:21px}
.opt.right{background:var(--green2);border-color:var(--green);box-shadow:0 3px 0 var(--green);color:#16503a}
.opt.wrong{background:var(--brick2);border-color:var(--brick);box-shadow:0 3px 0 var(--brick);color:#7c2a1a}
.opt.sel{border-color:var(--navy);background:#eef3fa;box-shadow:0 3px 0 var(--navy)}
.opt:disabled{cursor:default}
.opt .k{display:inline-block;min-width:24px;font-family:var(--fh);color:var(--ink2);font-weight:500}
.bells{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.bell{border:0;background:0 0;padding:0;display:flex;flex-direction:column;align-items:center;font-family:var(--fh);font-size:14px;color:var(--navy);min-height:84px}
.bell svg{width:52px;height:56px;transition:transform .2s;transform-origin:50% 8%}
.bell.ring svg{animation:bellRing .6s ease}
@keyframes bellRing{20%{transform:rotate(14deg)}
45%{transform:rotate(-11deg)}
70%{transform:rotate(6deg)}}.bell.right span{background:var(--green);color:#fff;border-radius:99px;padding:0 8px}
.bell.wrong span{background:var(--brick);color:#fff;border-radius:99px;padding:0 8px}
.bins{display:grid;gap:10px;margin:10px 0}
.bins.col{grid-template-columns:1fr!important}
.bins.col .bin{min-height:56px;justify-content:flex-start;padding:6px 14px}
.bin{min-height:70px;border-radius:16px;border:2px dashed #e9b22c;background:#fffbe8;font-family:var(--fh);font-size:17px;color:var(--brown);display:flex;align-items:center;justify-content:center;gap:8px;padding:6px}
.bin svg{width:36px;height:36px}
.bin.right{background:var(--green2);border-color:var(--green);border-style:solid;color:var(--green)}
.bin.wrong{background:var(--brick2);border-color:var(--brick);border-style:solid;color:var(--brick)}
.leaf-word{display:inline-flex;align-items:center;justify-content:center;min-width:150px;padding:14px 24px;border-radius:60% 40% 60% 40%/50% 50% 50% 50%;background:linear-gradient(135deg,#9bcb6a,#5e9e3c);color:#fff;font-size:26px;font-weight:700;box-shadow:0 6px 12px rgba(60,100,30,.25);animation:leafIn .6s ease;text-shadow:0 1px 2px rgba(0,0,0,.25)}
@keyframes leafIn{from{transform:translateY(-30px) rotate(-12deg);opacity:0}
to{transform:none;opacity:1}}.cab{border-collapse:separate;border-spacing:0;width:100%;font-size:16px;background:#5b3416;border-radius:12px;overflow:hidden;margin:6px 0}
.cab th{background:#7a4a22;color:#fbe7c2;font-family:var(--fh);font-weight:500;padding:5px 6px}
.cab td{background:#fffbe8;border-bottom:1px solid #e7d3ae;padding:5px 8px;color:var(--pali);font-weight:700}
.cab td:first-child{color:#6a4a2b;font-weight:500;font-size:14px;white-space:nowrap;background:#f7e6c7}
.cab td.hole{background:#ffe2a8;outline:2px dashed var(--orange);outline-offset:-4px;color:var(--orange2);text-align:center}
.cab td.dim{color:#c9b58f}
.candles{display:flex;justify-content:center;gap:10px;margin:8px 0;flex-wrap:wrap}
.candle{display:flex;flex-direction:column;align-items:center;width:74px;font-size:13px;color:var(--ink2)}
.candle svg{width:34px;height:64px}
.candle .cw{min-height:26px;color:var(--pali);font-weight:700;font-size:16px;text-align:center;line-height:1.2}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.match .col{display:flex;flex-direction:column;gap:8px}
.mt{min-height:54px;border-radius:12px;border:2px solid #d6e3f3;background:#fff;font-size:16.5px;font-weight:600;padding:6px 8px;line-height:1.3;box-shadow:0 3px 0 #d6e3f3;font-family:var(--fb)}
.mt.pl{color:var(--pali);font-size:20px}
.mt.sel{border-color:var(--navy);background:#eef3fa}
