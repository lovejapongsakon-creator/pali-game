<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="theme-color" content="#2F7FD1">
<title>หอไตรนามศัพท์ — ภาษาบาลี บ21202</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600&amp;family=Sarabun:wght@400;600;700&amp;display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="preload" as="image" href="img/hero.webp?v=202610301909">
<style>/* หอไตรนามศัพท์ รุ่น 6 — ระบบหน้าตาชุดเดียวทั้งเกม
 * สี: ฟ้า (หลัก) · ชมพู (ปุ่มเล่น) · เหลือง (ดาว รางวัล)  ตัวอักษร: Mitr หัวข้อ · Sarabun เนื้อหา
 * ทุกหน้าของนักเรียนกว้างไม่เกิน 560px อยู่กลางจอ (มือถือเต็มจอ คอมพิวเตอร์ไม่กางเกิน) */
:root{
  --sky:#2F7FD1;--sky-d:#1D5FA6;--sky-l:#E6F2FD;--pink:#E5508F;--pink-d:#C13A75;--pink-l:#FDE8F1;
  --gold:#F2B33D;--gold-d:#B98316;--gold-l:#FFF5D6;--green:#2E9A63;--green-l:#E5F6EC;--red:#D64545;--red-l:#FDECEC;
  --ink:#1E2A3A;--ink2:#5B6B7C;--ink3:#8D9AA8;--line:#E3EAF2;--card:#FFFFFF;--bg:#FFF9F1;
  --fh:'Mitr',system-ui,sans-serif;--fb:'Sarabun',system-ui,sans-serif;
  --r:20px;--r-s:14px;--sh:0 8px 24px rgba(29,95,166,.12);--sh-s:0 3px 10px rgba(29,95,166,.10);
  --fs:17px;--fs-s:14.5px;--fs-l:20px;--fs-xl:clamp(24px,6.4vw,30px);
  --w:560px;--gut:16px;--safe-b:env(safe-area-inset-bottom,0px)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font:400 var(--fs)/1.55 var(--fb);color:var(--ink);
  background:linear-gradient(180deg,#EAF4FF 0,#FFF9F1 360px,#FFF4F8 100%) fixed;overflow-x:hidden}
h1,h2,h3{font-family:var(--fh);font-weight:500;line-height:1.3;margin:0}
h1{font-size:var(--fs-xl)}h2{font-size:21px}h3{font-size:18px}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer}
img{max-width:100%}
.pali{font-family:var(--fb);font-weight:600;letter-spacing:.2px}
.muted{color:var(--ink2)}.small{font-size:var(--fs-s)}.center{text-align:center}.nw{white-space:nowrap}
.hidden{display:none!important}
.row{display:flex;gap:10px;align-items:center}.grow{flex:1;min-width:0}.wrapf{flex-wrap:wrap}
.stack>*+*{margin-top:12px}

/* ---------- โครงหน้า ---------- */
#app{max-width:var(--w);margin:0 auto;padding:0 var(--gut) calc(28px + var(--safe-b))}
.scr{display:none;animation:scrIn .28s ease}.scr.on{display:block}
@keyframes scrIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
body.wide #app{max-width:1180px}

/* แถบบน */
#topbar{position:sticky;top:0;z-index:30;margin:0 calc(-1 * var(--gut)) 12px;padding:8px var(--gut);display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
#topbar .crest{width:34px;height:34px;border-radius:50%}
#topbar .who{flex:1;min-width:0;line-height:1.25}
#topbar .who b{display:block;font-family:var(--fh);font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .who span{font-size:13px;color:var(--ink2)}
.sync{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;color:var(--green);padding:3px 8px;border-radius:99px;background:var(--green-l)}
.sync.err{color:var(--red);background:var(--red-l)}.sync.busy{color:var(--sky-d);background:var(--sky-l)}
.ibtn{width:42px;height:42px;border-radius:14px;border:0;background:var(--sky-l);color:var(--sky-d);display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:active{transform:scale(.94)}
#pv-banner{margin:0 0 10px;padding:8px 12px;border-radius:12px;background:var(--gold-l);color:var(--gold-d);font-size:var(--fs-s);text-align:center}

/* ---------- ชิ้นส่วนพื้นฐาน ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.card.flat{box-shadow:none;background:transparent;padding:4px 2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 18px;border:0;border-radius:16px;
  font-family:var(--fh);font-weight:500;font-size:18px;color:#fff;background:linear-gradient(180deg,#F0679F,var(--pink));box-shadow:0 4px 0 var(--pink-d);
  transition:transform .08s,box-shadow .08s;text-decoration:none;text-align:center;line-height:1.25}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--pink-d)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.btn.blue{background:linear-gradient(180deg,#4B95E0,var(--sky));box-shadow:0 4px 0 var(--sky-d)}.btn.blue:active{box-shadow:0 1px 0 var(--sky-d)}
.btn.green{background:linear-gradient(180deg,#3DB277,var(--green));box-shadow:0 4px 0 #1F7449}.btn.green:active{box-shadow:0 1px 0 #1F7449}
.btn.ghost{background:#fff;color:var(--sky-d);box-shadow:inset 0 0 0 2px var(--line),0 3px 0 var(--line)}.btn.ghost:active{box-shadow:inset 0 0 0 2px var(--line)}
.btn.sm{min-height:40px;font-size:15.5px;padding:6px 14px;border-radius:12px}
.btn.wide{width:100%}
.btn small{display:block;font-family:var(--fb);font-weight:400;font-size:13.5px;opacity:.92}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:13px;line-height:1.2;padding:4px 10px;border-radius:99px;background:var(--sky-l);color:var(--sky-d);white-space:nowrap}
.chip.ok{background:var(--green-l);color:var(--green)}.chip.warn{background:var(--red-l);color:var(--red)}.chip.gold{background:var(--gold-l);color:var(--gold-d)}.chip.mute{background:#EEF1F5;color:var(--ink2)}
.note{border-radius:14px;padding:10px 12px;font-size:var(--fs-s);margin:10px 0;display:flex;gap:8px;align-items:flex-start}
.note.ok{background:var(--green-l);color:#1F6B44}.note.warn{background:var(--red-l);color:#9B2C2C}.note.info{background:var(--sky-l);color:var(--sky-d)}.note.gold{background:var(--gold-l);color:#7A5609}
.note svg{flex:none;margin-top:2px}
.field{margin-bottom:12px}.field label{display:block;font-size:var(--fs-s);color:var(--ink2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;font:inherit;padding:11px 12px;border:2px solid var(--line);border-radius:12px;background:#FBFDFF;color:var(--ink)}
.field textarea{min-height:120px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sky);background:#fff}
.spin{width:36px;height:36px;border-radius:50%;border:4px solid var(--sky-l);border-top-color:var(--sky);animation:spin .8s linear infinite;margin:10px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.stars{display:inline-flex;gap:2px;vertical-align:middle}.stars i{display:inline-flex;color:#DDE3EA}.stars i.on{color:var(--gold)}
.chr{display:block;width:auto;height:auto;filter:drop-shadow(0 6px 8px rgba(60,30,0,.18))}
.face{border-radius:50%;object-fit:cover;object-position:center 28%;background:#FFF2DF;border:3px solid #fff;box-shadow:var(--sh-s)}
.crest{display:block}

/* ---------- เข้าสู่ระบบ ---------- */
.lg-hero{position:relative;border-radius:28px;overflow:hidden;aspect-ratio:16/10;box-shadow:var(--sh);background:#BFE3F7;margin-top:14px}
.lg-hero img{width:100%;height:100%;object-fit:cover;object-position:center 60%;display:block}
.lg-crest{width:104px;height:104px;margin:-52px auto 0;position:relative;z-index:2;border-radius:50%;background:#fff;padding:6px;box-shadow:0 8px 20px rgba(29,95,166,.25)}
.lg-crest::before{content:'';position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--sky),var(--pink),var(--gold),var(--sky));z-index:-1}
.lg-crest img,.lg-crest svg{width:100%;height:100%;border-radius:50%;display:block}
.lg-title{text-align:center;margin:10px 0 2px;font-size:clamp(30px,8.4vw,40px);font-weight:600;
  background:linear-gradient(90deg,var(--sky-d),var(--pink) 60%,var(--gold-d));-webkit-background-clip:text;background-clip:text;color:transparent}
.lg-sub{text-align:center;color:var(--ink2);font-size:var(--fs-s);margin-bottom:16px}
.lg-card{padding:18px}
.lg-quick{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;margin-bottom:14px;border-radius:16px;border:2px dashed #BFDDF7;background:var(--sky-l);text-align:left}
.lg-quick b{display:block;font-family:var(--fh);font-weight:500}.lg-quick span{font-size:var(--fs-s);color:var(--ink2)}
.id-input{width:100%;font:600 clamp(24px,7vw,30px)/1.2 var(--fb);letter-spacing:3px;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#FBFDFF;color:var(--ink);text-align:center}
.id-input::placeholder{letter-spacing:1px;color:#B9C6D3;font-weight:400}
.id-input:focus{outline:none;border-color:var(--pink);background:#fff}
.lg-card.bad .id-input{border-color:var(--red);animation:shake .4s}
.lg-err{color:var(--red);text-align:center;font-size:var(--fs-s);margin:8px 0 0}.lg-err:empty{display:none}
.lg-foot{text-align:center;margin-top:16px}.lg-foot small{display:block;color:var(--ink3);font-size:12.5px;margin-top:8px}
.linkbtn{border:0;background:none;color:var(--sky-d);text-decoration:underline;font-size:var(--fs-s);padding:8px}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ---------- หน้าแรก (หอไตร) ---------- */
.star-total{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:99px;background:rgba(255,245,214,.95);color:var(--gold-d);font-family:var(--fh);font-weight:500;white-space:nowrap;box-shadow:0 3px 10px rgba(120,80,0,.18)}
.star-total svg{color:var(--gold);animation:twirl 4s ease-in-out infinite}.star-total b{font-weight:500}
@keyframes twirl{0%,80%,100%{transform:none}88%{transform:rotate(72deg) scale(1.25)}}
/* ตัวละครที่แตะแล้วพูด */
.tk{position:absolute;display:block;cursor:pointer;z-index:3}
.tk.hop>img{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(.98,1.02)}}
.bub{position:absolute;bottom:calc(100% - 6px);left:50%;transform:translateX(-50%);width:max-content;max-width:170px;padding:7px 11px;border-radius:14px;background:#fff;color:var(--ink);
  font:500 13.5px/1.35 var(--fh);text-align:center;box-shadow:0 6px 16px rgba(30,42,58,.2);animation:bubIn .25s ease;pointer-events:none;z-index:5}
.bub::after{content:'';position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:#fff}
@keyframes bubIn{from{opacity:0;transform:translate(-50%,6px) scale(.9)}}
/* ฉากหัวหน้า: ซุ้มประตูวัดธรรมมงคล */
.hh{position:relative;height:250px;border-radius:26px 26px 0 0;overflow:hidden;margin:2px 0 0;background:#9FD3F2}
.hh-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 35%}
.hh::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,40,70,.18) 0,rgba(255,255,255,0) 28%);pointer-events:none}
.hh-cl{position:absolute;opacity:.9;filter:drop-shadow(0 4px 6px rgba(29,95,166,.15));animation:drift 9s ease-in-out infinite alternate;z-index:1}
.hh-cl.c1{top:58px;left:10px}.hh-cl.c2{top:64px;right:120px;animation-duration:12s;animation-delay:-4s}
@keyframes drift{to{transform:translateX(22px)}}
.hh-top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;z-index:2}
.hh-hi{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.92);font:500 15px/1.2 var(--fh);color:var(--sky-d);box-shadow:0 3px 10px rgba(29,95,166,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hh-nen{right:2px;bottom:-6px}.hh-nen img{height:150px;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
@keyframes bubSide{from{opacity:0;transform:translateX(8px) scale(.9)}}
.hh-nen .bub{left:auto;right:28%;bottom:calc(100% - 4px);transform:none;animation:bubSide .25s ease}
.hh-nen .bub::after{left:auto;right:12px;margin:0}
.hh-quest{position:relative;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:0 0 22px 22px;background:#fff;box-shadow:var(--sh);margin-bottom:12px;
  border-top:4px solid var(--gold)}
.q-tag{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;padding:3px 10px;border-radius:99px;background:var(--pink);color:#fff;margin-bottom:4px}
.hh-quest h2{font-size:18px;margin-bottom:0}
.hh-quest p{color:var(--ink2);font-size:14px;line-height:1.4;margin:0}
.hh-quest .btn{flex:none;min-height:48px;font-size:17px;padding:8px 16px;animation:nudge 2.6s ease-in-out infinite}
@keyframes nudge{0%,70%,100%{transform:none}78%{transform:scale(1.06)}86%{transform:scale(.98)}}
/* แถบไต่หอไตร */
.climb{background:#fff;border-radius:18px;box-shadow:var(--sh-s);padding:10px 14px 14px;margin-bottom:12px}
.cl-txt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.cl-txt b{font:500 15px/1.3 var(--fh)}.cl-txt span{font:500 14px var(--fh);color:var(--pink-d)}
.cl-bar{position:relative;height:12px;border-radius:99px;background:#EEF2F7;margin:0 12px 0 4px}
.cl-bar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--pink) 70%,var(--gold));animation:grow 1s ease-out}
@keyframes grow{from{width:0!important}}
.cl-me{position:absolute;bottom:-4px;transform:translateX(-50%);animation:slide 1s ease-out}.cl-me img{height:36px;width:auto}
.climb{padding-top:12px}.cl-txt{padding-right:4px;margin-bottom:26px}
@keyframes slide{from{left:0!important}}
/* คำศัพท์วันนี้ (พลิกได้) */
.wotd{perspective:900px;margin-bottom:12px;cursor:pointer;outline:none}
.wotd .wf{position:relative;height:118px;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.wotd.on .wf{transform:rotateY(180deg)}
.w-face{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 54px;text-align:center;overflow:hidden}
.w-front{background:linear-gradient(135deg,#FFE7F1,#FFF4D8 55%,#E3F1FF);box-shadow:var(--sh-s),inset 0 0 0 2px rgba(255,255,255,.9)}
.w-front::before,.w-front::after{content:'';position:absolute;width:70px;height:70px;border-radius:50%;background:radial-gradient(circle,rgba(242,179,61,.35),transparent 70%)}
.w-front::before{left:-14px;top:-18px}.w-front::after{right:-10px;bottom:-24px}
.w-back{background:linear-gradient(135deg,#1D5FA6,#2F7FD1);color:#fff;transform:rotateY(180deg);box-shadow:var(--sh-s)}
.w-tag{position:absolute;top:8px;left:12px;display:inline-flex;align-items:center;gap:4px;font:500 12.5px var(--fh);color:var(--pink-d)}
.w-back .w-tag{color:#FFE28C}
.wotd b.pali{font-size:clamp(24px,7vw,30px);line-height:1.25;color:var(--sky-d)}
.w-back b.pali{font-size:18px;color:#FFE28C}
.wotd small{color:var(--ink2);font-size:13px;margin-top:2px}
.w-back p{margin:2px 0 0;font:500 18px/1.35 var(--fh)}
.w-back .say-btn{position:absolute;right:10px;bottom:10px}
.wotd:focus-visible .wf{box-shadow:0 0 0 3px var(--sky);border-radius:20px}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tool{position:relative;display:flex;align-items:center;gap:8px;padding:8px 10px 8px 6px;border-radius:18px;border:0;text-align:left;min-height:72px;overflow:hidden;box-shadow:var(--sh-s)}
.tool.t-rev{background:linear-gradient(135deg,#E8F7EE,#fff)}.tool.t-cert{background:linear-gradient(135deg,#FFF5D6,#fff)}
.tool img{height:56px;width:auto;flex:none;transition:transform .2s}
.tool:hover img{transform:translateY(-3px) rotate(-3deg)}
.tool b{display:block;font-family:var(--fh);font-weight:500;font-size:16px;line-height:1.25}.tool span{font-size:13px;color:var(--ink2)}
.tool:active{transform:scale(.97)}

/* ---------- แผนที่ไต่หอไตร: ล่างกลางวัน → กลางตะวันตก → ยอดยามค่ำ ---------- */
.tower{position:relative;border-radius:26px;overflow:hidden;box-shadow:var(--sh);
  background:linear-gradient(180deg,#0B1640 0,#1D2A63 8%,#3E3A80 20%,#8A4F8F 32%,#E0787A 42%,#FFB073 50%,#FFDDA0 58%,#CDEBFF 70%,#E2F4FF 85%,#E6F6EA 100%)}
.tw-stars{position:absolute;left:0;right:0;top:0;height:34%;pointer-events:none}
.tw-stars i{position:absolute;width:var(--z);height:var(--z);border-radius:50%;background:#fff;box-shadow:0 0 6px #fff;animation:tw 2.8s ease-in-out var(--d) infinite}
@keyframes tw{50%{opacity:.2;transform:scale(.6)}}
.tw-lan{position:absolute;left:0;right:0;top:9%;height:24%;pointer-events:none}
.tw-lan i{position:absolute;bottom:0;width:13px;height:17px;border-radius:6px 6px 4px 4px;background:radial-gradient(circle at 50% 70%,#FFF3B0,#FFA94D 55%,#E2683C);
  box-shadow:0 0 14px 4px rgba(255,170,80,.55);opacity:0;animation:rise 13s linear infinite}
.tw-lan i:nth-child(1){left:12%}.tw-lan i:nth-child(2){left:30%;animation-delay:-3s;transform:scale(.8)}.tw-lan i:nth-child(3){left:47%;animation-delay:-7s}
.tw-lan i:nth-child(4){left:64%;animation-delay:-10s}.tw-lan i:nth-child(5){left:80%;animation-delay:-5s}.tw-lan i:nth-child(6){left:90%;animation-delay:-11.5s}
@keyframes rise{0%{opacity:0;transform:translate(0,0) scale(.7)}12%{opacity:.95}50%{transform:translate(8px,-45%) scale(.85)}88%{opacity:.85}100%{opacity:0;transform:translate(-6px,-95%) scale(.6)}}
.tw-band{position:absolute;inset:0;pointer-events:none}
.tw-band img{position:absolute;left:0;width:100%;height:15%;min-height:220px;object-fit:cover;opacity:.75;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(180deg,transparent,#000 30%,#000 70%,transparent)}
.tw-band .b1{top:24%;object-position:center 30%}.tw-band .b2{top:44%;object-position:center 40%}.tw-band .b3{top:66%;object-position:center 45%}
.tw-sum{position:relative;height:230px}
.tw-sum>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent);mask-image:linear-gradient(180deg,#000 62%,transparent)}
.tw-cap{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:99px;
  background:rgba(11,22,64,.55);color:#FFE28C;font:500 16px var(--fh);white-space:nowrap;box-shadow:0 0 18px rgba(255,226,140,.35);backdrop-filter:blur(4px);z-index:2}
.tw-mid{position:absolute;left:0;right:0;top:46%;height:30%;pointer-events:none}
.tw-cl{position:absolute;opacity:.85;animation:drift 10s ease-in-out infinite alternate}
.tw-cl.k1{top:8%;left:4%}.tw-cl.k2{top:40%;right:6%;animation-delay:-3s;animation-duration:13s}.tw-cl.k3{top:76%;left:10%;animation-delay:-6s;opacity:.7}
.tw-birds{position:absolute;top:-8%;right:14%;animation:drift 7s ease-in-out infinite alternate}
.tw-birds .bw{animation:flap .7s ease-in-out infinite;transform-origin:center;transform-box:fill-box}.tw-birds .b2{animation-delay:-.25s}.tw-birds .b3{animation-delay:-.45s}
@keyframes flap{50%{transform:scaleY(.4)}}
.tw-base{position:relative;height:200px;margin-top:6px}
.tw-base>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 70%;
  -webkit-mask-image:linear-gradient(180deg,transparent,#000 38%);mask-image:linear-gradient(180deg,transparent,#000 38%)}
.tw-start{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:99px;
  background:rgba(255,255,255,.93);color:var(--green);font:500 14px var(--fh);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15);z-index:2}
.map-rows{position:relative;max-width:460px;margin:0 auto;z-index:2}
.map-path{position:absolute;left:0;top:0;width:100%;pointer-events:none}
.mp-dash{animation:march 1.4s linear infinite}
@keyframes march{to{stroke-dashoffset:-28}}
.mrow{position:relative;height:112px}
.node{position:absolute;left:var(--x);top:50%;transform:translate(-50%,-50%);width:72px;height:72px;border:0;padding:0;border-radius:50%;background:none}
.node::after{content:'';position:absolute;left:6px;right:6px;bottom:-9px;height:12px;border-radius:50%;background:rgba(30,20,60,.22);filter:blur(3px);z-index:-1}
.node .ring{position:absolute;inset:0;border-radius:50%;background:conic-gradient(var(--pink) calc(var(--p)*1%),rgba(255,255,255,.75) 0);box-shadow:0 6px 16px rgba(20,30,70,.28)}
.node .disc{position:absolute;inset:6px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#E6F2FD 70%);display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:600;font-size:25px;color:var(--sky-d);overflow:hidden;box-shadow:inset 0 -4px 0 rgba(29,95,166,.12)}
.node.done .disc{background:radial-gradient(circle at 35% 28%,#FFFBEA,#FFD86B 75%);color:#8A5B00}
.node.done .ring{background:conic-gradient(#F2B33D,#FFE9A8,#F2B33D,#FFE9A8,#F2B33D);box-shadow:0 0 18px rgba(255,200,80,.7)}
.node.lock .disc{background:radial-gradient(circle at 35% 28%,#F7F9FB,#DCE3EA);color:#8C99A8}.node.lock .ring{background:rgba(255,255,255,.55)}
.node.lock{filter:saturate(.6)}
.node.no .disc{animation:shake .4s}
.node.exam .ring{background:conic-gradient(var(--gold),var(--pink),var(--sky),var(--gold));animation:spin 8s linear infinite}
.node.exam .disc{color:var(--pink-d)}
.node.cur::before{content:'';position:absolute;inset:-10px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 12px var(--pink);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:1}to{transform:scale(1.35);opacity:0}}
.node .me{position:absolute;left:50%;bottom:calc(100% - 14px);transform:translateX(-50%);animation:bob 2.2s ease-in-out infinite;z-index:2}
.node .me img{height:64px;width:auto}
@keyframes bob{50%{transform:translate(-50%,-6px)}}
.node .gd{position:absolute;right:-14px;bottom:-10px;width:36px;height:36px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);display:flex;align-items:center;justify-content:center;overflow:hidden}
.node .gd img,.node .gd svg{width:32px;height:32px;object-fit:contain}
.node.done .disc::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-100%);animation:shine 3.5s ease-in-out infinite}
@keyframes shine{60%,100%{transform:translateX(100%)}}
.mlab{position:absolute;top:50%;transform:translateY(-50%);width:calc(50% - 50px);max-width:210px;line-height:1.3;padding:7px 9px;border-radius:14px;
  background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(20,30,70,.16);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.mlab.r{left:calc(var(--x) + 42px)}.mlab.l{right:calc(100% - var(--x) + 42px);text-align:right}
.mlab b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-family:var(--fh);font-weight:500;font-size:14.5px}
.mlab small{display:block;color:var(--ink2);font-size:12.5px;margin-top:2px}
.mlab small.hot{color:var(--pink-d)}.mlab small.ok{color:var(--green)}.mlab small.late{color:var(--red)}
@media (prefers-reduced-motion:reduce){.hh *,.tower *,.climb *,.star-total svg{animation:none!important}.tw-lan{display:none}}

/* ---------- หน้าชั้น ---------- */
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--sky-d);font-family:var(--fh);font-size:16px;padding:6px 2px;margin-bottom:6px}
.back.light{position:absolute;top:10px;left:10px;z-index:4;margin:0;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.92);box-shadow:0 3px 10px rgba(20,40,70,.2)}
.ico{flex:none;display:inline-block;vertical-align:middle}
#scr-unit.has-fab{padding-bottom:88px}
/* ฉากหัวหน้าชั้น: ลานวัด + ผู้พิทักษ์ (หลับ/ตื่น) */
.u-hero{position:relative;height:250px;border-radius:26px;overflow:hidden;box-shadow:var(--sh);margin:2px 0 0;background:#9FD3F2}
.u-hero .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 45%}
.u-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(14,26,52,.72) 100%);pointer-events:none;z-index:1}
.u-gd{right:10px;bottom:46px;z-index:2}
.u-gd img{height:150px;width:auto;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
.u-gd.seal svg{display:block;margin:0 14px 20px 0}
.u-gd.sleep img,.u-gd.sleep svg{filter:grayscale(.85) brightness(.85) drop-shadow(0 6px 8px rgba(0,0,0,.3));animation:breathe 3.2s ease-in-out infinite;transform-origin:bottom center}
@keyframes breathe{50%{transform:scale(1.025,.985)}}
.u-gd.awake::before{content:'';position:absolute;left:50%;top:50%;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;background:radial-gradient(circle,rgba(255,226,140,.85),rgba(255,226,140,0) 68%);animation:glow 2.4s ease-in-out infinite;z-index:-1}
@keyframes glow{50%{transform:scale(1.12);opacity:.7}}
.zz{position:absolute;right:6px;top:4px;font:600 18px var(--fh);color:#fff;text-shadow:0 2px 6px rgba(0,0,0,.4);pointer-events:none}
.zz i{position:absolute;font-style:normal;opacity:0;animation:zz 3s ease-in infinite}.zz i:nth-child(2){animation-delay:1s;font-size:14px}.zz i:nth-child(3){animation-delay:2s;font-size:22px}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(16px,-40px)}}
.u-gd .bub{left:auto;right:55%;transform:none;animation:bubSide .25s ease}.u-gd .bub::after{left:auto;right:12px;margin:0}
.gd-cap{position:absolute;right:10px;bottom:24px;z-index:3;display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.92);font-size:13px;color:var(--gold-d);box-shadow:0 2px 8px rgba(0,0,0,.2);max-width:44%;white-space:nowrap;overflow:hidden}
.u-title{position:absolute;left:14px;bottom:26px;right:46%;z-index:3;color:#fff}
.u-no{display:inline-block;padding:3px 12px;border-radius:99px;background:linear-gradient(180deg,#FFD46B,var(--gold));color:#5C3B00;font:600 14px var(--fh);box-shadow:0 3px 8px rgba(0,0,0,.25);margin-bottom:6px}
.u-title h1{font-size:clamp(19px,5.2vw,23px);font-weight:600;line-height:1.25;text-shadow:0 2px 10px rgba(0,0,0,.55)}
/* แถบสถิติ */
.u-stats{position:relative;z-index:2;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:-14px 10px 14px}
.u-stats>div{background:#fff;border-radius:16px;box-shadow:var(--sh-s);padding:8px 6px;text-align:center;line-height:1.2}
.u-stats .si{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;margin-bottom:2px}
.si.gold{background:var(--gold-l);color:var(--gold)}.si.green{background:var(--green-l);color:var(--green)}.si.pink{background:var(--pink-l);color:var(--pink)}
.u-stats b{display:block;font:600 19px var(--fh)}.u-stats b small{font-size:12.5px;font-weight:400;color:var(--ink3)}
.u-stats span:last-child{font-size:12.5px;color:var(--ink2)}
/* การ์ดด่านใหญ่ */
.stage-card{background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;margin-bottom:14px}
.sh{position:relative;height:120px;overflow:hidden;background:var(--sky-d)}
.sh>img{position:absolute;right:0;top:0;width:62%;height:100%;object-fit:cover;object-position:center 30%;-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%);mask-image:linear-gradient(90deg,transparent,#000 35%)}
.sh{background:linear-gradient(120deg,#1D5FA6,#2F7FD1 55%,#5FA8EC)}
.stage-card.s2 .sh{background:linear-gradient(120deg,#A62D63,#E5508F 55%,#F28DB8)}
.stage-card.clear .sh{background:linear-gradient(120deg,#1F7449,#2E9A63 55%,#6BCB97)}
.sh-in{position:relative;z-index:1;padding:14px 16px;color:#fff;max-width:64%}
.sh-tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:rgba(255,255,255,.22);margin-bottom:4px}
.sh h2{font-size:24px;font-weight:600;line-height:1.15;text-shadow:0 2px 6px rgba(0,0,0,.25)}.sh h2 span{font-size:18px;font-weight:500;opacity:.92}
.sh p{margin:4px 0 0;font-size:13.5px;opacity:.95;display:flex;align-items:center;gap:4px}
.ring5{position:absolute;right:12px;bottom:10px;z-index:2;width:58px;height:58px;border-radius:50%;background:conic-gradient(#FFD46B calc(var(--p)*1%),rgba(255,255,255,.35) 0);display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(0,0,0,.25)}
.ring5::before{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
.ring5>*{position:relative;font-family:var(--fh);color:var(--ink)}.ring5 b{font-size:22px;font-weight:600}.ring5 small{font-size:12px;color:var(--ink3)}
.ring5 svg{position:relative;color:var(--green)}
.clear-rib{position:absolute;right:76px;bottom:16px;z-index:2;display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:#FFD46B;color:#5C3B00;font:500 13px var(--fh);box-shadow:0 2px 6px rgba(0,0,0,.2)}
.stage-card.lockd .sh{filter:grayscale(.7);opacity:.85}
/* ด่านย่อย: เส้นทางเชื่อมไอคอน */
.steps{position:relative;padding:12px 12px 14px}
.steps::before{content:'';position:absolute;left:43px;top:34px;bottom:34px;border-left:3px dotted #D5DEE8}
.step{position:relative;display:grid;grid-template-columns:50px 1fr auto;gap:10px;align-items:center;padding:8px 10px 8px 6px;border-radius:18px;border:0;background:none;width:100%;text-align:left;transition:transform .12s,background .2s}
.step+.step{margin-top:6px}
.step .ic{position:relative;width:50px;height:50px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(150deg,color-mix(in srgb,var(--c) 70%,#fff),var(--c));box-shadow:0 4px 0 color-mix(in srgb,var(--c) 70%,#000),0 6px 12px rgba(0,0,0,.12)}
.step .ic .ok{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.step .sb{min-width:0}
.step b{display:block;font-family:var(--fh);font-weight:500;font-size:16.5px;line-height:1.3}
.step small{display:block;font-size:13px;color:var(--ink2);line-height:1.35}
.step .sr small{font-size:12px;color:var(--ink3);white-space:nowrap}
.step:not(:disabled):hover{background:#F6F9FC}.step:not(:disabled):active{transform:scale(.98)}
.step.lock .ic{background:#E6EBF1;color:#A3AFBC;box-shadow:0 4px 0 #D3DAE2}
.step.lock b,.step.lock small{color:#A3AFBC}
.step.now{background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 45%,#fff)}
.step.now .ic{animation:wig 1.8s ease-in-out infinite}
@keyframes wig{0%,70%,100%{transform:none}80%{transform:scale(1.1) rotate(-4deg)}90%{transform:scale(.97)}}
.step .go{display:inline-flex;align-items:center;gap:4px;padding:6px 12px;border-radius:99px;background:var(--c);color:#fff;font:500 14px var(--fh);box-shadow:0 3px 0 color-mix(in srgb,var(--c) 70%,#000)}
.stage-card.off .steps{opacity:.45;pointer-events:none}
/* ด่านวัดผล */
.test-box{position:relative;margin-bottom:14px;padding:16px;border-radius:24px;background:linear-gradient(150deg,#FFF8E1,#FFE9B0);box-shadow:var(--sh);overflow:hidden}
.test-box::after{content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.8),transparent 70%)}
.test-box.ready{box-shadow:0 0 0 3px var(--gold),var(--sh)}
.tb-head{display:flex;align-items:center;gap:12px}
.tb-ic{width:56px;height:56px;border-radius:18px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff;background:linear-gradient(150deg,#FFD46B,#E0962A);box-shadow:0 4px 0 #B07012}
.test-box.ready .tb-ic{animation:wig 1.8s ease-in-out infinite}
.tb-head h3{font-size:20px;color:#6B4A00}.tb-head small{font-size:13px;color:#8A6A2A}
.test-box .score{position:relative;z-index:1;font:600 26px var(--fh);color:var(--gold-d)}.test-box .score small{font-size:14px;font-weight:400}
.tb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 10px}
.tb-chips span{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.75);font-size:13px;color:#6B5320}
.tb-att{font-size:13.5px;color:#6B5320;margin:4px 0;display:flex;align-items:center;gap:5px}
.test-box .steps{padding:4px 0}.test-box .steps::before{display:none}
.test-box .btn{margin-top:10px}
/* ปุ่มลอย เล่นต่อ */
.fab{position:fixed;left:50%;bottom:calc(14px + var(--safe-b));transform:translateX(-50%);z-index:20;width:min(calc(100% - 28px),528px);display:flex;align-items:center;gap:10px;
  padding:6px 8px 6px 10px;border:0;border-radius:22px;background:linear-gradient(180deg,#F0679F,var(--pink));color:#fff;text-align:left;box-shadow:0 5px 0 var(--pink-d),0 12px 26px rgba(193,58,117,.4);animation:fabIn .4s ease}
.fab img{height:58px;width:auto;margin-top:-22px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.fab small{display:block;font-size:12.5px;opacity:.9}.fab b{display:block;font:500 17px/1.25 var(--fh);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fab-go{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--pink);display:flex;align-items:center;justify-content:center;flex:none;animation:wig 1.8s ease-in-out infinite}
.fab:active{transform:translate(-50%,3px);box-shadow:0 2px 0 var(--pink-d)}
@keyframes fabIn{from{transform:translate(-50%,40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.u-hero *,.steps *,.fab,.fab *,.test-box *{animation:none!important}}

/* ---------- หน้าเล่น ---------- */
.play-top{display:flex;align-items:center;gap:10px;margin:4px 0 8px}
.play-top .ttl{flex:1;min-width:0}
.play-top .ttl b{display:block;font-family:var(--fh);font-weight:500;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.play-top .ttl span{font-size:13px;color:var(--ink2)}
.lives{display:flex;gap:3px}.lives i{display:inline-flex;color:var(--pink)}.lives i.off{color:#E2E7ED}
.pbar{height:10px;border-radius:9px;background:#E3EAF2;overflow:hidden;margin-bottom:10px}.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--sky),var(--pink));transition:width .35s}
#scr-play{--gc:#2F7FD1}
.scene{position:relative;height:clamp(150px,40vw,190px);border-radius:22px;overflow:hidden;margin-bottom:12px;box-shadow:var(--sh-s)}
.scene .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.scene::after{content:'';position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(0deg,rgba(255,255,255,.55),transparent)}
.scene .hero{position:absolute;left:4%;bottom:6px;height:84%;z-index:2}
.scene .mate{position:absolute;right:4%;bottom:6px;height:80%;z-index:2;animation:float 3.4s ease-in-out infinite}
.scene .boss-wrap{position:absolute;right:3%;bottom:4px;height:92%;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.scene .boss-wrap img{height:calc(100% - 18px);width:auto;animation:float 2.8s ease-in-out infinite}
.scene .boss-wrap.hurt img{animation:hit .5s ease}
.hp{display:flex;gap:2px;margin-top:4px;padding:3px;border-radius:8px;background:rgba(20,10,40,.45)}.hp i{width:10px;height:8px;border-radius:2px;background:#FF6B6B;transition:background .3s}.hp i.x{background:rgba(255,255,255,.25)}
.scene .say{position:absolute;z-index:3;left:28%;right:28%;top:12px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.95);font-size:var(--fs-s);text-align:center;box-shadow:var(--sh-s);animation:sayIn .3s ease}
.scene .combo{position:absolute;z-index:3;top:10px;left:50%;transform:translateX(-50%);display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:99px;
  background:linear-gradient(180deg,#FFC94A,#F29A1F);color:#fff;font:500 14px var(--fh);white-space:nowrap;box-shadow:0 4px 12px rgba(242,154,31,.5)}
.scene .combo.bump{animation:bump .45s ease}
@keyframes bump{40%{transform:translateX(-50%) scale(1.25)}}
.jump{animation:jump .6s ease}.shake{animation:shake .45s ease}
@keyframes jump{30%{transform:translateY(-14px)}60%{transform:none}80%{transform:translateY(-4px)}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes hit{20%{transform:translateX(-8px) rotate(-6deg);filter:brightness(1.7)}50%{transform:translateX(6px) rotate(4deg)}}

/* การ์ดโจทย์: แถบสีประจำเกม · ป้ายเกม · เลขข้อ */
.qin .qcard{animation:qIn .35s cubic-bezier(.2,.9,.3,1.2) backwards}
@keyframes qIn{from{transform:translateX(26px) scale(.98)}}
.qcard{position:relative;background:#fff;border-radius:24px;box-shadow:0 10px 26px color-mix(in srgb,var(--gc) 22%,transparent);padding:14px 16px 16px;margin-bottom:14px;text-align:center;overflow:hidden;
  border-top:6px solid var(--gc)}
.qcard::before{content:'';position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--gc) 14%,transparent),transparent 70%);pointer-events:none}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.qbadge{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--fh);padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--gc) 13%,#fff);color:color-mix(in srgb,var(--gc) 80%,#000);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qno{flex:none;font:500 13px var(--fh);color:var(--ink3)}
.qcard .qt{font-family:var(--fh);font-weight:500;font-size:clamp(19px,5vw,22px);line-height:1.45;color:var(--ink)}
.qcard .word{display:inline-flex;align-items:center;gap:10px;margin-top:12px;padding:8px 10px 8px 20px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--gc) 10%,#fff),#fff);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--gc) 25%,#fff)}
.qcard .word .pali{font:700 clamp(30px,8.6vw,40px)/1.2 var(--fb);color:color-mix(in srgb,var(--gc) 85%,#000)}
/* ใบลาน (เกมกวาดลาน) */
.leafw{position:relative;display:inline-flex;align-items:center;gap:10px;margin:14px auto 2px;padding:12px 16px 12px 26px;border-radius:40px 10px 40px 10px;
  background:linear-gradient(160deg,#F7E6B5,#E9C77A);box-shadow:0 6px 0 #C9A253,0 10px 18px rgba(150,110,30,.25);animation:sway 3s ease-in-out infinite;transform-origin:50% -40%}
.leafw::before{content:'';position:absolute;left:10px;right:10px;top:50%;border-top:2px dashed rgba(140,95,20,.35)}
.leafw .pali{position:relative;font:700 clamp(28px,8vw,36px)/1.2 var(--fb);color:#6B4300}
.leafw .say-btn{position:relative;background:rgba(255,255,255,.7);color:#8A5A08}
@keyframes sway{50%{transform:rotate(-2.5deg) translateY(-3px)}}
.qcard .sub{color:var(--ink2);font-size:var(--fs-s);margin-top:6px}
.claim{margin:12px auto 0;max-width:420px;padding:10px 14px;border-radius:16px;background:#FFF7E3;border:2px dashed #EBC46B;text-align:center}
.claim small{display:flex;align-items:center;justify-content:center;gap:4px;font-size:12.5px;color:#9A7420;margin-bottom:2px}
.claim b{font:500 18px/1.4 var(--fh);color:#6B4A00}
.say-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--sky-l);color:var(--sky-d);display:inline-flex;align-items:center;justify-content:center;flex:none}
.say-btn:active{transform:scale(.92)}

/* ปุ่มคำตอบ */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts.one{grid-template-columns:1fr}
.opt{--oc:var(--gc);position:relative;display:flex;align-items:center;gap:10px;min-height:60px;padding:10px 12px;border-radius:18px;border:2px solid #E3EAF2;background:#fff;font-size:18px;line-height:1.35;color:var(--ink);
  box-shadow:0 4px 0 #DCE4EE;text-align:left;transition:transform .1s,box-shadow .1s,border-color .15s;animation:optIn .35s ease backwards;animation-delay:var(--d,0ms)}
@keyframes optIn{from{transform:translateY(14px) scale(.96)}}
.opt:not(:disabled):hover{border-color:color-mix(in srgb,var(--oc) 50%,#fff);transform:translateY(-2px);box-shadow:0 6px 0 #DCE4EE}
.opt:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 #DCE4EE}
.opt.pl .ot{font-weight:600;font-size:19px}
.opt .ot{flex:1;min-width:0}
.opt .k{flex:none;display:inline-flex;width:32px;height:32px;border-radius:11px;background:var(--oc);color:#fff;align-items:center;justify-content:center;font:600 15px var(--fh);box-shadow:0 3px 0 color-mix(in srgb,var(--oc) 70%,#000)}
.opt .oi{flex:none;display:inline-flex;width:40px;height:40px;border-radius:13px;align-items:center;justify-content:center;color:#fff;background:linear-gradient(150deg,color-mix(in srgb,var(--oc) 70%,#fff),var(--oc));box-shadow:0 3px 0 color-mix(in srgb,var(--oc) 70%,#000)}
.opt.bl:not(:disabled):hover .oi svg{animation:ring .5s ease}
@keyframes ring{25%{transform:rotate(18deg)}50%{transform:rotate(-14deg)}75%{transform:rotate(8deg)}}
.opt.bk{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--oc) 6%,#fff))}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--green);background:var(--green-l);box-shadow:0 4px 0 #9ED6B8;color:#14593A;animation:okPop .4s ease}
.opt.wrong{border-color:var(--red);background:var(--red-l);box-shadow:0 4px 0 #F0B4B4;color:#8E2525;animation:shake .4s ease}
.opt.right::after,.opt.wrong::after{position:absolute;right:-6px;top:-8px;width:26px;height:26px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font:700 15px/1 var(--fh);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.opt.right::after{content:'✓';background:var(--green)}.opt.wrong::after{content:'✕';background:var(--red)}
.opt.right .k,.opt.right .oi{background:var(--green);box-shadow:0 3px 0 #1F7449}.opt.wrong .k,.opt.wrong .oi{background:var(--red);box-shadow:0 3px 0 #9B2C2C}
@keyframes okPop{40%{transform:scale(1.05)}}
/* ถูก/ผิด (ตาชั่ง · จับผิดเอไอ) */
.opts.tf .opt{flex-direction:column;justify-content:center;gap:6px;min-height:110px;text-align:center;font:500 18px var(--fh)}
.opts.tf .tfi{display:flex;width:52px;height:52px;border-radius:50%;align-items:center;justify-content:center;color:#fff}
.opts.tf .yes .tfi{background:linear-gradient(150deg,#5BC98C,var(--green));box-shadow:0 4px 0 #1F7449}
.opts.tf .no .tfi{background:linear-gradient(150deg,#F07A7A,var(--red));box-shadow:0 4px 0 #9B2C2C}
.opts.tf .yes:not(:disabled):hover{border-color:#9ED6B8}.opts.tf .no:not(:disabled):hover{border-color:#F0B4B4}
.opt.sel{border-color:var(--sky);background:var(--sky-l);box-shadow:0 4px 0 #A9CDEF}
.tbl-q{border-collapse:collapse;margin:12px auto 0;font-size:16px;border-radius:12px;overflow:hidden}.tbl-q th,.tbl-q td{border:1px solid var(--line);padding:6px 12px}
.tbl-q th{background:color-mix(in srgb,var(--gc) 12%,#fff);font-family:var(--fh);font-weight:500}.tbl-q td.hole{background:var(--gold-l);color:var(--gold-d);font-weight:700;animation:holeGlow 1.6s ease-in-out infinite}.tbl-q td.dim{color:var(--ink3)}
@keyframes holeGlow{50%{background:#FFE6A1}}
/* จับคู่ */
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}.match .col{display:grid;gap:8px;align-content:start}
.mt{min-height:56px;padding:8px;border-radius:16px;border:2px solid #E3EAF2;background:#fff;font-size:17px;box-shadow:0 4px 0 #DCE4EE;animation:optIn .35s ease backwards;animation-delay:var(--d,0ms);transition:transform .1s}
.mt.pl{font-weight:600;color:color-mix(in srgb,var(--gc) 80%,#000)}
.mt.sel{border-color:var(--gc);background:color-mix(in srgb,var(--gc) 10%,#fff);transform:scale(1.04);box-shadow:0 4px 0 color-mix(in srgb,var(--gc) 40%,#fff)}
.mt.ok{border-color:var(--green);background:var(--green-l);opacity:.6;animation:okPop .4s ease}.mt.bad{border-color:var(--red);background:var(--red-l);animation:shake .4s}
/* จุดเทียน */
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.slot{position:relative;border-radius:16px;padding:22px 4px 8px;background:#fff;box-shadow:var(--sh-s);text-align:center;font-size:13px;color:var(--ink2);min-height:80px}
.slot .flame{position:absolute;left:50%;top:6px;width:10px;height:14px;margin-left:-5px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#D5DEE8}
.slot b{display:block;font-size:17px;color:var(--ink);min-height:26px;margin-top:4px}
.slot.lit{background:linear-gradient(180deg,#FFF6D8,#fff)}.slot.lit b{color:var(--gold-d)}
.slot.lit .flame{background:radial-gradient(circle at 50% 70%,#FFF3B0,#FFA94D 60%,#E2683C);box-shadow:0 0 12px 3px rgba(255,170,80,.6);animation:flick .3s ease-in-out infinite alternate}
@keyframes flick{to{transform:scale(.9,1.08) rotate(3deg)}}
/* เรียงคำแปล */
.line{min-height:62px;border-radius:18px;border:2px dashed color-mix(in srgb,var(--gc) 40%,#fff);background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;margin-bottom:10px}
.pieces{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:12px}
.pc{padding:10px 14px;border-radius:14px;border:2px solid #E3EAF2;background:#fff;font-size:17px;box-shadow:0 4px 0 #DCE4EE;animation:optIn .3s ease backwards;animation-delay:var(--d,0ms)}
.line .pc{background:color-mix(in srgb,var(--gc) 10%,#fff);border-color:color-mix(in srgb,var(--gc) 35%,#fff);animation:okPop .25s ease}
.pc.used{visibility:hidden}
/* จับผิดเอไอ */
.ai-say{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin-top:12px}
.ai-say .bot{flex:none;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;background:linear-gradient(150deg,#6FD3DE,#1E9AA8);box-shadow:0 4px 0 #157581;animation:float 2.4s ease-in-out infinite}
.ai-bub{position:relative;padding:10px 16px;border-radius:18px 18px 18px 4px;background:#EAF8FA;text-align:left;box-shadow:inset 0 0 0 2px #BFE7EC}
.ai-bub small{display:block;font-size:12.5px;color:#1E7C87}.ai-bub b{font-size:22px}
/* หอความจำ */
.qcard.mem{background:linear-gradient(180deg,#fff,color-mix(in srgb,var(--gc) 7%,#fff))}
.mem-word{font:700 clamp(40px,12vw,60px)/1.25 var(--fb);color:color-mix(in srgb,var(--gc) 85%,#000);margin:12px 0 4px;animation:memIn .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes memIn{from{transform:scale(.5);opacity:0;filter:blur(6px)}}
.mem-bar{height:12px;border-radius:9px;background:#E7EEF5;overflow:hidden;margin:14px 0 12px}
.mem-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sky),var(--pink),var(--gold));transform-origin:left;animation:memT linear forwards}
@keyframes memT{to{transform:scaleX(0)}}
/* ดาว +๑ */
.plus{position:fixed;z-index:85;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:2px;font:600 20px var(--fh);color:#E0962A;text-shadow:0 2px 0 #fff,0 0 8px #fff;pointer-events:none;animation:plusUp .95s ease-out forwards}
.plus svg{color:var(--gold)}
@keyframes plusUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}20%{opacity:1;transform:translate(-50%,-80%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-260%) scale(1)}}

/* แผ่นผลตอบ (ขึ้นจากด้านล่าง) */
#fb{position:fixed;left:0;right:0;bottom:0;z-index:40;transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1)}
#fb.on{transform:none}
#fb .sheet{max-width:var(--w);margin:0 auto;background:linear-gradient(180deg,#EFFAF3,#fff 46%);border-radius:26px 26px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.14);padding:16px 16px calc(16px + var(--safe-b));border-top:6px solid var(--green)}
#fb.bad .sheet{border-top-color:var(--red);background:linear-gradient(180deg,#FFF1F1,#fff 46%)}
#fb .fb-h{display:flex;align-items:center;gap:10px;font:500 21px var(--fh);color:var(--green)}
#fb.bad .fb-h{color:var(--red)}
.fb-ic{display:inline-flex;width:44px;height:44px;border-radius:50%;align-items:center;justify-content:center;color:#fff;background:var(--green);box-shadow:0 4px 0 #1F7449;flex:none}
#fb.on .fb-ic{animation:okPop .45s ease .1s backwards}
#fb.bad .fb-ic{background:var(--red);box-shadow:0 4px 0 #9B2C2C}
#fb .fb-b{margin:8px 0 12px;font-size:16.5px}
#fb .coach{display:flex;gap:10px;align-items:flex-end;margin-bottom:12px}
#fb .coach img{height:86px;width:auto;flex:none}
#fb .coach .bub{position:relative;left:auto;bottom:auto;transform:none;width:auto;max-width:none;flex:1;background:var(--gold-l);border-radius:16px 16px 16px 4px;padding:8px 12px;font:400 15.5px/1.45 var(--fb);text-align:left;box-shadow:none;animation:none}
#fb .coach .bub::after{display:none}
#fb .coach .bub b{display:block;font-family:var(--fh);font-weight:500;color:var(--gold-d);font-size:14px}

/* ป๊อปอัปเริ่มใหม่: พระอาจารย์ให้กำลังใจ */
#modal .box.m-fail{position:relative;overflow:hidden;background:linear-gradient(180deg,#FFF6E0 0,#fff 42%);padding-top:12px}
.m-fail #m-pic img{max-height:none}
.fail-pic{position:relative;height:170px;width:220px;display:flex;align-items:flex-end;justify-content:center}
.fail-pic .chr{position:relative;z-index:2;height:150px;animation:float 3.2s ease-in-out infinite}
.fail-pic .halo{position:absolute;left:50%;top:10px;width:150px;height:150px;margin-left:-75px;border-radius:50%;background:radial-gradient(circle,rgba(255,214,120,.9),rgba(255,214,120,0) 70%);animation:glow 3s ease-in-out infinite}
.fail-pic .petal{position:absolute;bottom:20px;width:12px;height:18px;border-radius:12px 0 12px 0;background:linear-gradient(135deg,#FFC2DA,#F27DAE);opacity:0;animation:petal 4.5s ease-in infinite;z-index:1}
.fail-pic .petal:nth-child(3){left:20%;animation-delay:0s}.fail-pic .petal:nth-child(4){left:75%;animation-delay:.8s}.fail-pic .petal:nth-child(5){left:35%;animation-delay:1.6s}
.fail-pic .petal:nth-child(6){left:62%;animation-delay:2.4s}.fail-pic .petal:nth-child(7){left:10%;animation-delay:3.1s}.fail-pic .petal:nth-child(8){left:88%;animation-delay:3.7s}
@keyframes petal{0%{opacity:0;transform:translateY(0) rotate(0)}15%{opacity:.9}100%{opacity:0;transform:translateY(-150px) translateX(20px) rotate(220deg)}}
.m-fail #m-title{font-size:20px;color:var(--pink-d);margin:4px 0 6px}
.elder-say{position:relative;margin:0 auto 12px;max-width:340px;padding:12px 16px;border-radius:18px;background:#fff;box-shadow:0 6px 18px rgba(185,131,22,.18);font:500 18px/1.5 var(--fh);color:var(--ink);text-align:center;animation:sayIn .4s ease .15s backwards}
.elder-say::before{content:'';position:absolute;left:50%;top:-8px;margin-left:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.cheer{text-align:center;margin:6px 0 2px;padding:10px 12px;border-radius:16px;background:linear-gradient(135deg,#FFF3D1,#FFE7F0)}
.cheer .pali{display:block;font:700 21px/1.4 var(--fb);color:var(--pink-d)}.cheer small{display:block;color:#7A5A2A;font-size:14px}
.last{background:var(--red-l);border-radius:14px;padding:8px 12px;margin:10px 0 0;font-size:15px;text-align:left}.last b{color:var(--red);font-family:var(--fh);font-weight:500}
details.last summary{cursor:pointer;color:var(--red);font:500 14px var(--fh);list-style:none;text-align:center}details.last summary::-webkit-details-marker{display:none}
details.last[open] summary{margin-bottom:4px}
@keyframes sayIn{from{opacity:0;transform:translateY(6px) scale(.92)}}
@media (prefers-reduced-motion:reduce){#scr-play *,.fail-pic *,#fb *{animation:none!important}}

/* ---------- ป๊อปอัป · ข้อความเด้ง · ผลสอบ ---------- */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,35,55,.45)}
#modal.on{display:flex;animation:scrIn .2s ease}
#modal .box{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#fff;border-radius:26px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);text-align:center}

function rpc(fn, ...args) {

}

}
/* คิวบันทึกผลด่านย่อย: เก็บในเครื่องก่อน ส่งอยู่เบื้องหลัง เน็ตหลุดก็ไม่หาย */
const SAVEQ = { q: store('q') || [], busy: false };
function queueSave(ev) { SAVEQ.q.push(ev); store('q', SAVEQ.q); flushSave(); }
async function flushSave() {
  if (SAVEQ.busy || !SAVEQ.q.length || !APP.sid) return;

    while (SAVEQ.q.length) {

      const r = await rpcRetry('saveStep', [APP.sid, ev.ev], 3);
      if (!r || r.reason === 'BUSY') throw new Error('BUSY'); // ระบบยังยุ่ง: เก็บไว้ส่งรอบหน้า ไม่ทิ้งผล
      if (r.ok) APP.state.u[String(r.u)] = r.us;

}

function paliToThai(w) {
  const ch = Array.from(w), ak = [];
  for (let i = 0; i < ch.length; i++) {
    let pre = '';
    if (ch[i] === 'เ' || ch[i] === 'โ') { pre = ch[i]; i++; }
    const c = ch[i]; if (!c || !/[ก-ฮ]/.test(c)) continue;
    const a = { pre, c, vir: false, v: '', nig: false };
    while (i + 1 < ch.length && /[ฺิีุูาํึ]/.test(ch[i + 1])) {
      const m = ch[++i];

/* ---------- หอความจำ: คำปรากฏ ๓–๕ วินาที แล้วซ่อน ให้เลือกคำที่เห็น (ตัวลวงเป็นคำที่หน้าตาคล้ายกันในหน่วยเดียวกัน) ---------- */

    m = new Map();

  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;

function fillTo(u, items, n) {

}
/** จับผิด AI: ใช้ข้อในแท็บจับผิดAI ก่อน ถ้าไม่พอ ให้นกแก้วตอบข้อฝึกในคลัง (ถูกบ้างผิดบ้าง) */

/** ภารกิจรวมพลัง (ฝึก ง): สลับเกมหลายแบบเท่าที่หน่วยนี้มีเนื้อหารองรับ */
function genApply(u, n) {
  const codes = shuffle(["sort", "pair", "bell", "table", "order", "build", "vocab"]),
    out = [];

  if (pass && !free && st < 3) msg += '<p class="small muted center">ไม่ผิดเลยสักข้อจะได้ ๓ ดาว เล่นซ้ำเพื่อเก็บดาวได้</p>';

      <div class="big-score">${thn(c)}<span>/${thn(n)}</span></div>${msg}`, buttons })
    .then(v => { if (v === 'again') startStep(u, step); else if (v === 'next' && nextStep) startStep(u, nextStep.step); else if (v === 'home') openHome(); else openUnit(u); });
}

/* ===== ด่านวัดผล · สอบกลางภาค · สอบปลายภาค (ตรวจที่เซิร์ฟเวอร์ ไม่เฉลยระหว่างสอบ) ===== */
let T = null;
function openExam(set) {
  const E = set === 'FIN' ? APP.fin : APP.mid;

  if (E.status !== 'open') { toast(E.status === 'locked' ? 'สอบ' + EXN[set] + 'เปิด' + thDate(E.open, { wd: true }) : 'ปิดสอบ' + EXN[set] + 'แล้ว'); return; }

}
async function startScored(set) {

    : `<ul><li>${thn(cf.testN)} ข้อ ข้อละ ${thn(cf.testSec)} วินาที</li><li>ตอบแล้วย้อนกลับไม่ได้ ไม่เฉลยระหว่างสอบ</li><li>ครั้งที่ ${thn(us.att.length + 1)} จาก ${thn(maxAttempts())} นับครั้งที่ได้มากที่สุด</li>${x.status === 'late' ? `<li>ส่งช้า: คะแนนครั้งนี้ × ${thn(cf.lateMult)}</li>` : ''}</ul>`;
  const go = await modal({ title: isEx ? 'สอบ' + EXN[set] : `ด่านวัดผล ชั้น ${thn(u)}`, pic: chr('nen-wai', 120), html: rules + '<p class="small muted center">ปิดหนังสือ ตั้งใจทำด้วยตนเอง</p>',
    buttons: [{ t: 'ยังก่อน', v: false, cls: 'ghost' }, { t: 'เริ่มสอบ', v: () => { room = ($('#room') || {}).value || ''; return true; } }] });
  if (!go) return;

    if (!r || !r.ok) { modal({ title: 'ยังเข้าสอบไม่ได้', pic: chr('nen-shy', 110), html: `<p class="center">${esc(REASON[r && r.reason] || (r && r.reason) || 'ไม่ทราบสาเหตุ')}</p>` }); return; }
    T = { set, u, sess: r.sess, idx: r.sess.idx, sel: -1, off: r.sess.now - Date.now(), q: [] };
    if (r.resumed) toast('ทำต่อจากข้อที่ ' + thn(T.idx + 1));

    renderTest();

  while (T.q.length || T.flushing) await sleep(250);

}

      ${!isEx ? `<div class="row" style="justify-content:center">${medalSVG(tier, 46)}<b>เกียรติบัตรระดับ${tier}</b></div>` : ''}</div>
    ${r.wrong && r.wrong.length && !isEx ? `<div class="card"><h3>${ui('book', 18)} เรื่องที่ควรทบทวนในหนังสือ</h3><ul>${r.wrong.map(q => `<li>${safeHTML(q)}</li>`).join('')}</ul><p class="small muted">ไม่เฉลยคำตอบ เพื่อให้ฝึกจริงก่อนสอบครั้งต่อไป</p></div>` : ''}
    ${!isEx && r.attLeft ? `<div class="note info">ยังสอบได้อีก ${thn(r.attLeft)} ครั้ง หลังฝึกซ้ำจุดพลาด ๖ ข้อ</div>` : ''}
    <div class="row wrapf">${cert ? `<button class="btn green grow" id="r-cert">${ui('medal', 18)} ดูใบเกียรติบัตร</button>` : ''}<button class="btn ghost grow" id="r-back">${isEx ? 'กลับหน้าแรก' : 'กลับหน้าชั้น'}</button></div>`;

/* ===== แผงครู: ภาพรวม ความก้าวหน้า คะแนน กิจกรรม วิเคราะห์ข้อสอบ สิทธิ์พิเศษ ทะเบียน ตั้งค่า ===== */
const Teacher = (() => {
  const S = { code: "", d: null, tab: "ov", cls: "", day: "" };
  const TABS = [
    ["ov", "ภาพรวม", "chart"],
    ["pg", "ความก้าวหน้า", "list"],
    ["sc", "คะแนน", "star"],
    ["lg", "กิจกรรมรายวัน", "cal"],
    ["it", "วิเคราะห์ข้อสอบ", "eye"],
    ["gr", "สิทธิ์พิเศษ", "key"],
    ["ro", "ทะเบียน", "users"],
    ["st", "ตั้งค่า", "gear"],
  ];
  const ST = { locked: "ยังไม่เปิด", open: "เปิด", late: "รับส่งช้า", closed: "ปิดรับคะแนน" };
  async function enter(code) {
    S.code = code;
    S.tab = "ov";
    $("#topbar").classList.add("hidden");
    $("#pv-banner").classList.add("hidden");

      <button class="btn sm ghost" id="t-reload">โหลดใหม่</button><button class="btn sm ghost" id="t-exit">ออก</button></div>
      <div class="t-tabs" id="t-tabs"></div><div id="t-body"></div>`;
    show("scr-teacher");
    $("#t-body").innerHTML = '<div class="card center"><div class="spin"></div><p>กำลังโหลดข้อมูลทั้งห้อง\u2026</p></div>';
    $("#t-tabs").innerHTML = TABS.map(
      ([k, n, i]) => `<button data-t="${k}" class="${k === S.tab ? "on" : ""}">${ui(i, 15)} ${n}</button>`,
    ).join("");
    $$("#t-tabs [data-t]").forEach(
      (b) =>

  async function load() {

        `<div class="card warn">เชื่อมต่อไม่สำเร็จ แสดงข้อมูลบางส่วนไม่ได้ (${esc(e.message)}) <button class="btn sm" onclick="Teacher.load()">ลองใหม่</button></div>`;

          .map((l) => l.split(/\t|,/).map((s) => s.trim()))
          .filter((c) => c.length >= 3)
          .map((c) => (c.length >= 4 ? { no: c[0], id: c[1], name: c[2], cls: c[3] } : { no: "", id: c[0], name: c[1], cls: c[2] }));
        if (!list.length) return toast("ไม่พบข้อมูลที่จะนำเข้า");
        const r = await act("roster", { list: list });
        if (r) {
          toast(`เพิ่ม ${r.added} \xb7 แก้ ${r.updated} \xb7 ข้าม ${r.skipped}`);
          load();
        }
      };
    },
    st() {
      v5BindTeacher(S.code, load);
      $("#s-save").onclick = async () => {
        let n = 0;
        for (const el of $$("[data-cfg]")) {
          if (await act("cfg", { key: el.dataset.cfg, value: el.value.trim() }, " ")) n++;
        }
        toast("บันทึก " + n + " รายการ");
        load();
      };
      $("#s-pv").onclick = async () => {
        const r = await rpcRetry("login", ["#" + S.code], 2);
        if (r && r.ok) {
          $("#topbar").classList.remove("hidden");
          await enterAs("#" + S.code, r);
        }
      };
      $("#s-cno").oninput = () => {
        const q = $("#s-cno").value.trim();
        const hit = q.length > 5 ? S.d.certs.filter((c) => c[0].includes(q)) : [];
        $("#s-cres").innerHTML =
          hit
            .map(
              (c) =>
                `<div class="okbox">${esc(c[0])} \xb7 ${esc(c[2])} (${esc(c[3])}) \xb7 หน่วย ${esc(c[4])} \xb7 ระดับ${esc(c[5])} ${esc(c[6])} \xb7 ออกเมื่อ ${esc(c[7])}</div>`,
            )
            .join("") || (q.length > 5 ? '<div class="warn">ไม่พบเลขที่นี้</div>' : "");
      };
      $("#s-setup").onclick = async () => {
        const r = await act("setup", {}, "ตรวจแท็บเรียบร้อย");
        if (r) $("#s-rep").textContent = (r.report || []).join(" \xb7 ") || "ครบทุกแท็บแล้ว";
      };
      $("#s-ref").onclick = () => act("refresh", {}, "ล้างแคชแล้ว ข้อมูลจากชีตจะแสดงทันที");
      $("#s-code").onclick = async () => {
        let v = "";
        const ok = await modal({
          title: "เปลี่ยนรหัสครู",
          html: '<div class="field"><label>รหัสใหม่ (อย่างน้อย ๔ ตัว)</label><input id="nc"></div>',
          buttons: [
            { t: "ยกเลิก", v: false, cls: "ghost" },
            {
              t: "บันทึก",
              v: () => {
                v = $("#nc").value.trim();
                return true;
              },
            },
          ],
        });
        if (ok && v && (await act("code", { newCode: v }, "เปลี่ยนรหัสครูแล้ว"))) S.code = v;
      };
    },
  };
  return { enter: enter, load: load };
})();

/* ---------- แผงครู: ลายเซ็น สอบปลายภาค ลิงก์หน้าเกม ---------- */
function v5TeacherSettings(d) {
  const f = (k, v, h) =>
    `<div class="field"><label>${esc(k)}${h ? " — " + esc(h) : ""}</label><input data-cfg="${esc(k)}" value="${esc(v || "")}"></div>`;
  const has20 = d.units.some((x) => x.u >= 11);
  return `${swCard(d.units)}<div class="card"><h3>${ui("book", 18)} เนื้อหาหน่วย ๑๑–๒๐ และข้อสอบปลายภาค</h3>
    <p class="small muted">${has20 ? "ในชีตมีหน่วย ๑๑ ขึ้นไปแล้ว กดซ้ำได้ ระบบเพิ่มเฉพาะส่วนที่ยังไม่มี" : "นำเนื้อหา คำศัพท์ ตารางแจก ข้อฝึก ๒๐ ข้อ/หน่วย แบบทดสอบท้ายหน่วย จับผิด AI ประโยคแปล และข้อสอบปลายภาค ๕๐ ข้อ จากหนังสือเล่ม ๒ เข้าชีตครั้งเดียว"}</p>
    <button class="btn sm ${has20 ? "ghost" : ""}" id="sd-imp">นำเข้าเนื้อหาหน่วย ๑๑–๒๐</button><div id="sd-msg" class="small muted"></div></div>
    <div class="card"><h3>${ui("key", 18)} ลายเซ็นผู้สอนบนใบเกียรติบัตร</h3>
    <p class="small muted">ถ่ายรูปลายเซ็นด้วยปากกาสีน้ำเงินหรือดำบนกระดาษขาว ระบบจะทำพื้นขาวให้โปร่งใสและย่อขนาดให้เอง</p>
    <img id="sg-prev" class="sign-prev" alt="ตัวอย่างลายเซ็น"><div class="row wrapf"><label class="btn sm ghost" style="cursor:pointer">เลือกรูปลายเซ็น<input id="sg-file" type="file" accept="image/*" hidden></label>
    <button class="btn sm" id="sg-save" disabled>บันทึกลายเซ็น</button><button class="btn sm ghost" id="sg-del">ลบลายเซ็น</button><button class="btn sm navy" id="sg-test">ดูตัวอย่างใบเกียรติบัตร</button></div><div id="sg-msg" class="small muted"></div></div>
    <div class="card"><h3>${ui("cal", 18)} สอบปลายภาค · ลิงก์ · เกณฑ์ผ่าน</h3>
    ${f("วันเปิดสอบปลายภาค", d.fin && d.fin.open, "ปปปป-ดด-วว")}${f("วันปิดสอบปลายภาค", d.fin && d.fin.close, "ปปปป-ดด-วว")}${f("รหัสห้องสอบปลายภาค", d.roomFin, "ว่าง = ไม่ต้องกรอก")}
    ${f("ผิดได้ไม่เกิน (ข้อ)", d.cfg.maxWrong === undefined ? 2 : d.cfg.maxWrong, "ต่อด่านย่อย ผิดเกินต้องเริ่มใหม่")}${f("จำนวนข้อต่อด่านย่อย", d.cfg.stepN, "แนะนำ ๑๕ ให้ด่านใหญ่ละราว ๑ ชั่วโมง")}${f("เวลาอ่านหอความจำ (วินาที)", d.cfg.memSec || 4, "๓–๕")}${f("ลิงก์หน้าเกม (GitHub Pages)", d.gameUrl, "ลิงก์เดิมในหนังสือจะพามาที่นี่")}${f("ลิงก์ตราโรงเรียน", d.cfg.crest)}
    <p class="small muted">กดปุ่ม “บันทึกการตั้งค่า” ด้านบนเพื่อบันทึกช่องเหล่านี้พร้อมกัน</p></div>`;
}
/* ---------- แผงครู: สวิตช์เปิด/ปิดรายด่าน (ด่าน ๑ · ด่าน ๒ · ด่านวัดผล ของแต่ละชั้น) ---------- */
const SW_KEYS = [
  ["s1", "ด่าน ๑"],
  ["s2", "ด่าน ๒"],
  ["t", "วัดผล"],
];
const SW_TXT = { "": "ตามวัน", on: "เปิด", off: "ปิด" };
const SW_ST = { locked: "ยังไม่ถึงวัน", open: "เปิดอยู่", late: "เลยกำหนด", closed: "ปิดรับคะแนน" };
function swBtn(x, k, label) {
  const v = (x.sw && x.sw[k]) || "";
  return `<button type="button" class="sw-btn sw-${v || "auto"}" data-swu="${x.u}" data-swk="${k}" data-swv="${v}">${label}<small>${SW_TXT[v]}</small></button>`;
}
function swCard(units) {
  return `<div class="card"><h3>${ui("key", 18)} เปิด/ปิดด่าน</h3>
    <p class="small muted">แตะเพื่อสลับ: <b>ตามวัน</b> (เปิดตามปฏิทินอัตโนมัติ) → <b>เปิด</b> (เปิดทันทีแม้ยังไม่ถึงวัน) → <b>ปิด</b> (นักเรียนเข้าเล่นไม่ได้ ผลที่ทำไว้ไม่หาย) · ครูทดลองเล่นเข้าได้เสมอ</p>
    <div class="sw-grid" id="sw-grid">${units.map((x) => `<div class="sw-row"><div class="sw-u"><b>ชั้น ${thn(x.u)}</b><small>${esc(SW_ST[x.status] || "")}</small></div>${SW_KEYS.map(([k, l]) => swBtn(x, k, l)).join("")}</div>`).join("")}</div></div>`;
}
function bindSwitches(code) {
  const g = $("#sw-grid");
  if (!g) return;
  g.onclick = async (e) => {
    const b = e.target.closest("[data-swk]");
    if (!b || b.disabled) return;
    const next = { "": "เปิด", on: "ปิด", off: "" }[b.dataset.swv];
    b.disabled = true;
    b.classList.add("busy");
    try {
      const r = await rpcRetry("teacherAction", [code, "unitSwitch", { u: +b.dataset.swu, key: b.dataset.swk, value: next }], 2);
      if (!r || !r.ok) throw new Error(r && (r.msg || r.reason));
      const x = r.units.find((y) => y.u === +b.dataset.swu),
        mine = APP.units.find((y) => y.u === x.u);
      if (mine) Object.assign(mine, { sw: x.sw, status: x.status });
      b.closest(".sw-row").outerHTML =
        `<div class="sw-row"><div class="sw-u"><b>ชั้น ${thn(x.u)}</b><small>${esc(SW_ST[x.status] || "")}</small></div>${SW_KEYS.map(([k, l]) => swBtn(x, k, l)).join("")}</div>`;
      toast(`ชั้น ${thn(x.u)} ${SW_KEYS.find((s) => s[0] === b.dataset.swk)[1]}: ${next || "ตามวัน"}`);
    } catch (err) {
      toast("บันทึกไม่สำเร็จ: " + (err.message || err));
      b.disabled = false;
      b.classList.remove("busy");
    }
  };
}
function v5BindTeacher(code, reload) {
  bindSwitches(code);
  $("#sd-imp").onclick = async () => {
    const m = $("#sd-msg"),
      b = $("#sd-imp");
    b.disabled = true;
    m.textContent = "กำลังโหลดไฟล์เนื้อหา…";
    const keep = CFG.rpcTimeout;
    CFG.rpcTimeout = 180000;
    try {
      const seed = await fetch("seed-u11-20.json", { cache: "no-store" }).then((r) => {
        if (!r.ok) throw new Error("ไม่พบไฟล์ seed-u11-20.json บน GitHub");
        return r.json();
      });
      m.textContent = "กำลังเขียนลงชีต (อาจใช้เวลา ๓๐–๖๐ วินาที อย่าปิดหน้านี้)…";
      const r = await rpc("teacherAction", code, "importSeed", { tabs: seed.tabs, cfg: seed.cfg });
      if (r && r.ok) {
        m.textContent = "นำเข้าแล้ว: " + r.report.join(" · ") + ` · รวม ${thn(r.units)} หน่วย`;
        toast("นำเข้าเนื้อหาหน่วย ๑๑–๒๐ แล้ว");
      } else m.textContent = "ไม่สำเร็จ: " + (r && (r.msg || r.reason));
    } catch (e) {
      m.textContent = "ไม่สำเร็จ: " + e.message;
    }
    CFG.rpcTimeout = keep;
    b.disabled = false;
  };
  const prev = $("#sg-prev"),
    msg = $("#sg-msg");
  let data = "";
  SIGN_DATA = null;
  rpcRetry("getSignature", [], 2)
    .then((r) => {
      if (r && r.ok && r.data) {
        prev.src = r.data;
        SIGN_DATA = r.data;
      } else msg.textContent = "ยังไม่มีลายเซ็นในระบบ";
    })
    .catch(() => {});
  $("#sg-file").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const im = new Image();
    im.onload = () => {
      let s = Math.min(1, 900 / im.width, 320 / im.height),
        out;
      for (let k = 0; k < 4; k++) {
        const cv = document.createElement("canvas");
        cv.width = Math.round(im.width * s);
        cv.height = Math.round(im.height * s);
        const ctx = cv.getContext("2d");
        ctx.drawImage(im, 0, 0, cv.width, cv.height);
        const px = ctx.getImageData(0, 0, cv.width, cv.height),
          a = px.data;
        for (let i = 0; i < a.length; i += 4) {
          const l = (a[i] + a[i + 1] + a[i + 2]) / 3;
          if (l > 200) a[i + 3] = 0;
          else if (l > 150) a[i + 3] = Math.round(((200 - l) / 50) * 255);
        }
        ctx.putImageData(px, 0, 0);
        out = cv.toDataURL("image/png");
        if (out.length < 450000) break;
        s *= 0.7;
      }
      data = out;
      prev.src = out;
      $("#sg-save").disabled = false;
      msg.textContent = "ตรวจดูรูปด้านบน แล้วกด “บันทึกลายเซ็น”";
      URL.revokeObjectURL(im.src);
    };
    im.src = URL.createObjectURL(file);
  };
  const save = async (val, ok) => {
    try {
      const r = await rpcRetry("teacherAction", [code, "signature", { data: val }], 2);
      if (r && r.ok) {
        toast(ok);
        APP.cfg.hasSign = !!val;
        SIGN_DATA = val;
        reload();
      } else toast("ไม่สำเร็จ: " + (r && (r.msg || r.reason)));
    } catch (e) {
      toast("เชื่อมต่อไม่สำเร็จ");
    }
  };
  $("#sg-save").onclick = () => data && save(data, "บันทึกลายเซ็นแล้ว");
  $("#sg-del").onclick = async () => {
    if (
      await modal({
        title: "ลบลายเซ็น?",
        html: "<p>ใบเกียรติบัตรที่เปิดหลังจากนี้จะไม่มีลายเซ็น</p>",
        buttons: [
          { t: "ยกเลิก", v: false, cls: "ghost" },
          { t: "ลบ", v: true },
        ],
      })
    )
      save("", "ลบลายเซ็นแล้ว");
  };
  $("#sg-test").onclick = () => {
    const keep = APP.me;
    APP.me = APP.me || { name: "สามเณรตัวอย่าง ใจดี", id: "70690000", cls: "1/1" };
    const u = APP.units[0] || { u: 1, title: "ตัวอย่าง" };
    Cert.view({
      no: `${APP.cfg.subj}-${APP.cfg.year}-ห01-ตัวอย่าง`,
      u: u.u,
      title: u.title,
      tier: "ทอง",
      raw: 10,
      n: 10,
      date: APP.today,
      guardPali: u.guardPali,
    }).then(() => {
      APP.me = keep;
    });
  };
}

boot();
</script>
